name: Publish registry
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-publication
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_MODE: scan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-proposals
          path: _proposals.json
          retention-days: 7
  publish:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: registry-proposals
      - run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_MODE: persist
      - name: Request catalogue deployment
        env:
          DEPLOY_HOOK: ${{ secrets.REGISTRY_DEPLOY_HOOK }}
        run: python scripts/deploy.py
