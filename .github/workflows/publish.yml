name: Publish registry
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-publication
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_MODE: scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-proposals
          path: _proposals.json
          retention-days: 7
  publish:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: registry-proposals
      - run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_MODE: persist
      - name: Request catalogue deployment
        env:
          DEPLOY_HOOK: ${{ secrets.REGISTRY_DEPLOY_HOOK }}
        run: python scripts/deploy.py
